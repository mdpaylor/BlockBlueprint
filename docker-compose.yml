services:
  db:
    image: postgres:17
    container_name: blox-blueprint-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: blox_blueprint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blox_blueprint"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./BloxBlueprint
      dockerfile: Dockerfile

    container_name: blox-blueprint-api
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/blox_blueprint
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 3600000

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data: